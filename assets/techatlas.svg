<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glowTa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridTa" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .node-title { font-weight: 700; font-size: 13px; fill: #F8FAFC; }
    .node-sub { font-size: 10px; fill: #94A3B8; }
    .tag { font-size: 9px; font-weight: 600; fill: #38BDF8; letter-spacing: 0.05em; }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; fill: #64748B; }
  </style>

  <!-- Container -->
  <rect width="1100" height="380" rx="14" fill="url(#bgTa)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1100" height="380" rx="14" fill="url(#gridTa)" />

  <!-- Title Header inside SVG -->
  <g transform="translate(35, 30)">
    <text x="0" y="0" class="mono section-label">SYSTEM ARCHITECTURE · PIPELINE</text>
    <text x="0" y="24" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">TechAtlas: Hybrid Lexical + Dense Retrieval Engine</text>
    <text x="630" y="24" class="mono" font-size="11" fill="#38BDF8">DIMS: 384 [ONNX] | HYBRID RANKING: BM25 + pgvector</text>
  </g>

  <!-- PIPELINE FLOW -->

  <!-- Column 1: Sources & Ingestion -->
  <g transform="translate(35, 95)">
    <!-- Stage Box -->
    <rect width="170" height="235" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" class="mono tag">01 · INGESTION</text>
    <text x="14" y="44" class="sans node-title">Document Corpus</text>
    
    <!-- Items -->
    <g transform="translate(14, 60)">
      <rect width="142" height="32" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" class="mono" font-size="11" fill="#E2E8F0">RFCs &amp; Technical Specs</text>

      <rect y="40" width="142" height="32" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="60" class="mono" font-size="11" fill="#E2E8F0">GitHub Code &amp; Wikis</text>

      <rect y="80" width="142" height="32" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="100" class="mono" font-size="11" fill="#E2E8F0">Stack Overflow Dumps</text>

      <rect y="120" width="142" height="36" rx="4" fill="#132347" stroke="#38BDF8" stroke-width="1" />
      <text x="10" y="137" class="mono" font-size="10" fill="#38BDF8">Stream Normalizer</text>
      <text x="10" y="150" class="sans node-sub">HTML/MD Strip + Cleaning</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 210 210 L 255 210" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Column 2: Indexing & Analysis -->
  <g transform="translate(260, 95)">
    <rect width="180" height="235" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="24" class="mono tag">02 · ANALYSIS &amp; NLP</text>
    <text x="14" y="44" class="sans node-title">Text Processing</text>

    <g transform="translate(14, 60)">
      <rect width="152" height="42" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="18" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Porter Stemmer</text>
      <text x="10" y="32" class="sans node-sub">Stop-word elimination</text>

      <rect y="50" width="152" height="42" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="68" class="sans" font-size="11" font-weight="600" fill="#F8FAFC">Positional Postings</text>
      <text x="10" y="82" class="sans node-sub">Term offsets for phrases</text>

      <rect y="100" width="152" height="56" rx="4" fill="#132347" stroke="#818CF8" stroke-width="1" />
      <text x="10" y="118" class="mono" font-size="11" font-weight="600" fill="#818CF8">ONNX Dense Embed</text>
      <text x="10" y="133" class="sans node-sub">all-MiniLM-L6-v2</text>
      <text x="10" y="146" class="mono" font-size="9" fill="#38BDF8">384-dim Float Vector</text>
    </g>
  </g>

  <!-- Connectors from 2 to 3A and 3B -->
  <path d="M 445 150 L 490 150" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M 445 270 L 490 270" stroke="#818CF8" stroke-width="1.8" />

  <!-- Column 3: Dual Storage & Indexes -->
  <g transform="translate(495, 95)">
    <!-- Branch A: Lexical Inverted Index -->
    <rect width="210" height="110" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <text x="14" y="24" class="mono tag">03A · LEXICAL ENGINE</text>
    <text x="14" y="44" class="sans node-title">Inverted Index (In-Memory + Disk)</text>
    <text x="14" y="62" class="sans node-sub">• Term Dictionary with B-Tree lookup</text>
    <text x="14" y="77" class="sans node-sub">• BM25 Scoring (k1=1.2, b=0.75)</text>
    <text x="14" y="92" class="sans node-sub">• AST Evaluator (AND/OR/NOT, Wildcard)</text>

    <!-- Branch B: Vector pgvector HNSW -->
    <g transform="translate(0, 125)">
      <rect width="210" height="110" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
      <text x="14" y="24" class="mono" font-size="9" font-weight="600" fill="#C084FC">03B · DENSE VECTOR STORE</text>
      <text x="14" y="44" class="sans node-title">PostgreSQL + pgvector</text>
      <text x="14" y="62" class="sans node-sub">• HNSW Graph Index (M=16, efSearch=64)</text>
      <text x="14" y="77" class="sans node-sub">• Cosine Distance Metric</text>
      <text x="14" y="92" class="sans node-sub">• Startup Hydration &amp; Crash Recovery</text>
    </g>
  </g>

  <!-- Connectors from 3A/3B to Hybrid Ranking -->
  <path d="M 710 150 L 760 195" stroke="#38BDF8" stroke-width="1.8" />
  <path d="M 710 270 L 760 215" stroke="#818CF8" stroke-width="1.8" />

  <!-- Column 4: Hybrid Ranking & Output -->
  <g transform="translate(765, 95)">
    <rect width="295" height="235" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" filter="url(#glowTa)" />
    <rect width="295" height="235" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="18" y="26" class="mono" font-size="10" font-weight="700" fill="#38BDF8">04 · MULTI-SIGNAL FUSION</text>
    <text x="18" y="48" class="sans" font-size="16" font-weight="700" fill="#F8FAFC">Hybrid Ranker &amp; Cache</text>

    <g transform="translate(18, 62)">
      <!-- Formula Box -->
      <rect width="260" height="38" rx="4" fill="#080C17" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="24" class="mono" font-size="11" fill="#38BDF8">Score = α·BM25 + (1-α)·Sim_vec</text>

      <rect y="46" width="260" height="34" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" class="mono" font-size="10" fill="#94A3B8">Redis L2 Query Cache (TTL: 3600s)</text>

      <rect y="88" width="260" height="66" rx="4" fill="#132347" stroke="#38BDF8" stroke-width="1" />
      <text x="10" y="20" class="mono" font-size="11" font-weight="700" fill="#F8FAFC">✓ Top-K High-Precision Hits</text>
      <text x="10" y="38" class="sans node-sub">Highlighted match snippets</text>
      <text x="10" y="52" class="sans node-sub">Positional exact phrase match verification</text>
    </g>
  </g>
</svg>
