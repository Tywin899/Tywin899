<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="activeTa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132347" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <filter id="glowTa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridTa" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
    <marker id="arrowTa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38BDF8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#818CF8" />
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .stage-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
    .stage-title { font-weight: 700; font-size: 14px; fill: #F8FAFC; }
    .item-header { font-size: 11px; font-weight: 700; fill: #F8FAFC; }
    .item-sub { font-size: 10px; fill: #94A3B8; }
    .subhead { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; fill: #64748B; }
  </style>

  <!-- Container -->
  <rect width="1180" height="390" rx="14" fill="url(#bgTa)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1180" height="390" rx="14" fill="url(#gridTa)" />

  <!-- Diagram Title Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" class="mono subhead">SYSTEM ARCHITECTURE · PIPELINE</text>
    <text x="0" y="24" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">TechAtlas: Hybrid Lexical + Dense Retrieval Engine</text>
    <text x="730" y="24" class="mono" font-size="11" fill="#38BDF8">DIMS: 384 [ONNX] · HYBRID RANKING: BM25 + pgvector</text>
  </g>

  <!-- ==================== COLUMN 1: INGESTION ==================== -->
  <g transform="translate(30, 75)">
    <rect width="195" height="285" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 70 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="14" y="24" class="mono stage-tag" fill="#38BDF8">01 · INGESTION</text>
    <text x="14" y="44" class="sans stage-title">Document Corpus</text>

    <g transform="translate(12, 58)">
      <!-- Item 1 -->
      <rect width="171" height="36" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" class="mono" font-size="11" fill="#E2E8F0">RFCs &amp; Technical Specs</text>

      <!-- Item 2 -->
      <rect y="44" width="171" height="36" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" transform="translate(0, 44)" class="mono" font-size="11" fill="#E2E8F0">GitHub Code &amp; Wikis</text>

      <!-- Item 3 -->
      <rect y="88" width="171" height="36" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" transform="translate(0, 88)" class="mono" font-size="11" fill="#E2E8F0">Stack Overflow Dumps</text>

      <!-- Normalizer Box -->
      <rect y="132" width="171" height="78" rx="4" fill="#0B132B" stroke="#38BDF8" stroke-width="1" />
      <text x="10" y="20" transform="translate(0, 132)" class="mono" font-size="11" font-weight="700" fill="#38BDF8">Stream Normalizer</text>
      <text x="10" y="38" transform="translate(0, 132)" class="sans item-sub">• HTML/Markdown stripper</text>
      <text x="10" y="54" transform="translate(0, 132)" class="sans item-sub">• UTF-8 clean &amp; validate</text>
      <text x="10" y="70" transform="translate(0, 132)" class="sans item-sub">• Metadata tagging</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(225, 217)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowTa)" />
  </g>

  <!-- ==================== COLUMN 2: ANALYSIS ==================== -->
  <g transform="translate(265, 75)">
    <rect width="205" height="285" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 70 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="14" y="24" class="mono stage-tag" fill="#38BDF8">02 · ANALYSIS &amp; NLP</text>
    <text x="14" y="44" class="sans stage-title">Text Processing</text>

    <g transform="translate(12, 58)">
      <!-- Item 1: Stemmer -->
      <rect width="181" height="58" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" class="sans item-header">Porter Stemmer</text>
      <text x="10" y="36" class="sans item-sub">• Stop-word elimination</text>
      <text x="10" y="50" class="sans item-sub">• Case folding &amp; tokenization</text>

      <!-- Item 2: Postings -->
      <rect y="66" width="181" height="58" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" transform="translate(0, 66)" class="sans item-header">Positional Postings</text>
      <text x="10" y="36" transform="translate(0, 66)" class="sans item-sub">• Term offset tracking</text>
      <text x="10" y="50" transform="translate(0, 66)" class="sans item-sub">• Exact phrase match index</text>

      <!-- Item 3: ONNX -->
      <rect y="132" width="181" height="78" rx="4" fill="#0B132B" stroke="#818CF8" stroke-width="1" />
      <text x="10" y="20" transform="translate(0, 132)" class="mono" font-size="11" font-weight="700" fill="#818CF8">ONNX Dense Embed</text>
      <text x="10" y="38" transform="translate(0, 132)" class="sans item-sub">• all-MiniLM-L6-v2</text>
      <text x="10" y="54" transform="translate(0, 132)" class="sans item-sub">• 384-dimensional vector</text>
      <text x="10" y="70" transform="translate(0, 132)" class="mono" font-size="9" fill="#38BDF8">In-process ONNX Runtime</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3A & 3B -->
  <g transform="translate(470, 140)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowTa)" />
  </g>
  <g transform="translate(470, 280)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowPurple)" />
  </g>

  <!-- ==================== COLUMN 3: STORAGE & RETRIEVAL ==================== -->
  <g transform="translate(510, 75)">
    <!-- 3A: Lexical Engine -->
    <g transform="translate(0, 0)">
      <rect width="235" height="135" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="14" y="22" class="mono stage-tag" fill="#38BDF8">03A · LEXICAL ENGINE</text>
      <text x="14" y="40" class="sans stage-title">Inverted Index</text>

      <g transform="translate(12, 50)">
        <rect width="211" height="74" rx="4" fill="#080C17" stroke="#1E293B" stroke-width="0.8" />
        <text x="8" y="18" class="sans item-sub">• In-Memory + Disk B-Tree</text>
        <text x="8" y="34" class="sans item-sub">• BM25 Ranking (k1=1.2, b=0.75)</text>
        <text x="8" y="50" class="sans item-sub">• AST Boolean Parser (AND/OR/NOT)</text>
        <text x="8" y="66" class="sans item-sub">• Wildcard &amp; phrase resolution</text>
      </g>
    </g>

    <!-- 3B: Dense Vector Store -->
    <g transform="translate(0, 150)">
      <rect width="235" height="135" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.2" />
      <text x="14" y="22" class="mono stage-tag" fill="#818CF8">03B · DENSE VECTOR STORE</text>
      <text x="14" y="40" class="sans stage-title">PostgreSQL + pgvector</text>

      <g transform="translate(12, 50)">
        <rect width="211" height="74" rx="4" fill="#080C17" stroke="#1E293B" stroke-width="0.8" />
        <text x="8" y="18" class="sans item-sub">• HNSW Graph (M=16, efSearch=64)</text>
        <text x="8" y="34" class="sans item-sub">• Cosine distance metric</text>
        <text x="8" y="50" class="sans item-sub">• Startup index hydration</text>
        <text x="8" y="66" class="sans item-sub">• Crash consistency repair</text>
      </g>
    </g>
  </g>

  <!-- Connectors 3A/3B -> 4 -->
  <g transform="translate(745, 140)">
    <path d="M 0 0 L 20 0 L 35 40" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowTa)" />
  </g>
  <g transform="translate(745, 280)">
    <path d="M 0 0 L 20 0 L 35 -40" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowPurple)" />
  </g>

  <!-- ==================== COLUMN 4: HYBRID RANKER & OUTPUT ==================== -->
  <g transform="translate(790, 75)">
    <rect width="360" height="285" rx="8" fill="url(#activeTa)" stroke="#38BDF8" stroke-width="1.4" filter="url(#glowTa)" />
    <rect width="360" height="285" rx="8" fill="url(#activeTa)" stroke="#38BDF8" stroke-width="1.4" />
    <path d="M 14 0 L 90 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="16" y="24" class="mono stage-tag" fill="#38BDF8">04 · MULTI-SIGNAL FUSION</text>
    <text x="16" y="44" class="sans stage-title">Hybrid Ranker &amp; Cache</text>

    <g transform="translate(14, 58)">
      <!-- Formula Box -->
      <rect width="332" height="42" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="18" class="mono" font-size="9" fill="#94A3B8">RECIPROCAL RANK FUSION / SCORE:</text>
      <text x="12" y="33" class="mono" font-size="11" font-weight="700" fill="#38BDF8">Score = α · BM25 + (1-α) · Sim_vec</text>

      <!-- Redis Cache Layer -->
      <rect y="50" width="332" height="42" rx="4" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="18" transform="translate(0, 50)" class="mono" font-size="11" font-weight="700" fill="#F8FAFC">Redis L2 Query Cache</text>
      <text x="12" y="33" transform="translate(0, 50)" class="sans item-sub">TTL caching layer for high-frequency repeated queries</text>

      <!-- High Precision Output Box -->
      <rect y="100" width="332" height="110" rx="4" fill="#0B132B" stroke="#38BDF8" stroke-width="1" />
      <text x="12" y="22" transform="translate(0, 100)" class="mono" font-size="11" font-weight="700" fill="#34D399">✓ Top-K High-Precision Results</text>
      <text x="12" y="42" transform="translate(0, 100)" class="sans item-sub">• Highlighted term snippets in context</text>
      <text x="12" y="58" transform="translate(0, 100)" class="sans item-sub">• Positional phrase match verification</text>
      <text x="12" y="74" transform="translate(0, 100)" class="sans item-sub">• Document score decomposition</text>
      <text x="12" y="94" transform="translate(0, 100)" class="mono" font-size="9" fill="#38BDF8">Fast Java + Spring Boot Microservice</text>
    </g>
  </g>
</svg>
