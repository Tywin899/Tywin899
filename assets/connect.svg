<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 140" width="100%" height="100%">
  <defs>
    <linearGradient id="bgConn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glowConn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridConn" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <rect width="1180" height="140" rx="12" fill="url(#bgConn)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1180" height="140" rx="12" fill="url(#gridConn)" />
  <path d="M 12 0 L 1168 0" stroke="url(#cyanLine)" stroke-width="2.5" stroke-linecap="round" />

  <g transform="translate(40, 32)">
    <!-- Status Tag -->
    <rect width="360" height="22" rx="4" fill="#0B132B" stroke="#334155" stroke-width="0.8" />
    <circle cx="10" cy="11" r="3.5" fill="#34D399" filter="url(#glowConn)" />
    <text x="22" y="15" class="mono" font-size="10" font-weight="700" fill="#38BDF8">AVAILABLE FOR BACKEND &amp; SEARCH SYSTEMS ROLES</text>

    <!-- Headline -->
    <text x="0" y="52" class="sans" font-size="24" font-weight="800" fill="#F8FAFC">Let’s build something reliable.</text>
    
    <!-- Subtitle -->
    <text x="0" y="80" class="sans" font-size="14" fill="#94A3B8">Open to backend engineering, search infrastructure, and applied machine learning opportunities.</text>
  </g>

  <!-- Right side decorative badge -->
  <g transform="translate(940, 42)">
    <rect width="200" height="56" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1" />
    <text x="14" y="24" class="mono" font-size="10" fill="#818CF8">LOCATION &amp; CONTACT</text>
    <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">📍 Pune, India · Remote</text>
  </g>
</svg>
