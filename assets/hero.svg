<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cyan to Purple Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Background Lighting -->
    <radialGradient id="radialCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080C17" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="85%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080C17" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .subtitle { font-weight: 600; letter-spacing: 0.22em; }
    .badge-text { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; fill: #38BDF8; }
    .terminal-text { font-size: 11px; fill: #64748B; letter-spacing: 0.05em; }
    .pulse-dot { animation: pulse 3s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>

  <!-- Base Card -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />
  <rect width="1200" height="360" rx="16" fill="url(#radialCyan)" />
  <rect width="1200" height="360" rx="16" fill="url(#radialPurple)" />

  <!-- Top Ambient Glow Line -->
  <path d="M 16 0 L 1184 0" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Abstract Geometric Perspective Grid (Right Side) -->
  <g opacity="0.35" transform="translate(680, 40)">
    <!-- Perspective lines radiating from vanishing point -->
    <line x1="450" y1="120" x2="100" y2="20" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="450" y1="120" x2="120" y2="70" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="450" y1="120" x2="140" y2="130" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="450" y1="120" x2="130" y2="200" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="450" y1="120" x2="100" y2="260" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="450" y1="120" x2="220" y2="290" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Isometric Plane Cubes -->
    <polygon points="320,80 370,55 420,80 370,105" fill="#1E293B" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1" />
    <polygon points="320,80 370,105 370,160 320,135" fill="#0F172A" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1" />
    <polygon points="370,105 420,80 420,135 370,160" fill="#1E293B" fill-opacity="0.8" stroke="#818CF8" stroke-width="1" />

    <polygon points="200,160 250,135 300,160 250,185" fill="#1E293B" fill-opacity="0.3" stroke="#818CF8" stroke-width="1" />
    <polygon points="200,160 250,185 250,235 200,210" fill="#0F172A" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" />
    <polygon points="250,185 300,160 300,210 250,235" fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1" />
  </g>

  <!-- Network Nodes & Data Streams (Right Side) -->
  <g transform="translate(680, 30)">
    <!-- Connections -->
    <path d="M 120 70 L 250 135 L 370 105 L 420 190 L 260 240 Z" fill="none" stroke="#334155" stroke-width="1.2" />
    <path d="M 250 135 L 420 190" stroke="url(#accentGrad)" stroke-width="1.5" filter="url(#cyanGlow)" />
    <path d="M 120 70 L 200 160 L 260 240" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />
    
    <!-- Vector Search Coordinate Nodes -->
    <circle cx="120" cy="70" r="4" fill="#38BDF8" filter="url(#cyanGlow)" />
    <circle cx="250" cy="135" r="5" fill="#818CF8" filter="url(#cyanGlow)" />
    <circle cx="370" cy="105" r="6" fill="#38BDF8" filter="url(#cyanGlow)" />
    <circle cx="420" cy="190" r="4" fill="#C084FC" />
    <circle cx="260" cy="240" r="4" fill="#38BDF8" />
    <circle cx="200" cy="160" r="3" fill="#94A3B8" />

    <!-- Node Ring Pulses -->
    <circle cx="370" cy="105" r="14" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
    <circle cx="250" cy="135" r="12" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.4" />

    <!-- Vector Dimension Indicators -->
    <text x="385" y="100" class="mono" font-size="9" fill="#94A3B8">d=384 [ONNX]</text>
    <text x="265" y="140" class="mono" font-size="9" fill="#38BDF8">BM25(q,d)</text>
    <text x="435" y="195" class="mono" font-size="9" fill="#C084FC">HNSW: M=16</text>
    <text x="135" y="65" class="mono" font-size="9" fill="#64748B">p(θ|X)</text>
  </g>

  <!-- Left Side Content: Identity & Positioning -->
  <g transform="translate(70, 75)">
    <!-- Pill Badge: Systems Engineering -->
    <g transform="translate(0, 0)">
      <rect width="360" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38BDF8" filter="url(#cyanGlow)" />
      <text x="28" y="18" class="mono badge-text">SYSTEMS · INFORMATION RETRIEVAL · ML</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="sans title" font-size="48" fill="#F8FAFC" filter="url(#softGlow)">SOHAM HADAP</text>
    <text x="0" y="95" class="sans title" font-size="48" fill="#F8FAFC">SOHAM HADAP</text>

    <!-- Subtitle / Track -->
    <text x="2" y="132" class="mono subtitle" font-size="14" fill="url(#accentGrad)">
      BACKEND ENGINEERING · AI / ML · SEARCH SYSTEMS
    </text>

    <!-- Engineering Statement -->
    <text x="2" y="172" class="sans" font-size="14" fill="#94A3B8" font-weight="400">
      Architecting high-throughput distributed backends, hybrid inverted &amp; vector search engines,
    </text>
    <text x="2" y="194" class="sans" font-size="14" fill="#94A3B8" font-weight="400">
      and spatiotemporal risk models with deterministic algorithms and production rigor.
    </text>

    <!-- Status Ticker Box -->
    <g transform="translate(0, 220)">
      <rect width="490" height="26" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="17" class="mono terminal-text">
        <tspan fill="#38BDF8">●</tspan> STACK: Java · Spring Boot · pgvector · Redis · Docker · Python
      </text>
    </g>
  </g>
</svg>
