<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glowDom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .dom-num { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
    .dom-title { font-size: 13px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.05em; }
    .tech-pill { font-size: 10px; fill: #94A3B8; }
    .tech-highlight { font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Card 1: Backend Systems -->
  <g transform="translate(0, 0)">
    <rect width="260" height="150" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 100 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="16" y="24" class="mono dom-num" fill="#38BDF8">01 / ARCHITECTURE</text>
    <text x="16" y="44" class="sans dom-title">BACKEND SYSTEMS</text>
    
    <g transform="translate(16, 60)">
      <text x="0" y="14" class="mono tech-pill"><tspan class="tech-highlight" fill="#38BDF8">Java</tspan> · <tspan class="tech-highlight">Spring Boot</tspan></text>
      <text x="0" y="32" class="mono tech-pill">PostgreSQL · Redis</text>
      <text x="0" y="50" class="mono tech-pill">Docker · REST APIs</text>
      <text x="0" y="68" class="mono tech-pill" fill="#64748B">Maven · CI Pipelines</text>
    </g>
  </g>

  <!-- Card 2: Search & IR -->
  <g transform="translate(280, 0)">
    <rect width="260" height="150" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 100 0" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="16" y="24" class="mono dom-num" fill="#818CF8">02 / RETRIEVAL</text>
    <text x="16" y="44" class="sans dom-title">SEARCH &amp; IR</text>

    <g transform="translate(16, 60)">
      <text x="0" y="14" class="mono tech-pill"><tspan class="tech-highlight" fill="#818CF8">BM25</tspan> · <tspan class="tech-highlight">Inverted Index</tspan></text>
      <text x="0" y="32" class="mono tech-pill">pgvector · HNSW Index</text>
      <text x="0" y="50" class="mono tech-pill">FAISS · AST Boolean</text>
      <text x="0" y="68" class="mono tech-pill" fill="#64748B">Positional Postings</text>
    </g>
  </g>

  <!-- Card 3: AI & Machine Learning -->
  <g transform="translate(560, 0)">
    <rect width="260" height="150" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 100 0" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" />

    <text x="16" y="24" class="mono dom-num" fill="#C084FC">03 / INTELLIGENCE</text>
    <text x="16" y="44" class="sans dom-title">AI &amp; MACHINE LEARNING</text>

    <g transform="translate(16, 60)">
      <text x="0" y="14" class="mono tech-pill"><tspan class="tech-highlight" fill="#C084FC">Python</tspan> · <tspan class="tech-highlight">RAG Pipelines</tspan></text>
      <text x="0" y="32" class="mono tech-pill">Bayesian Inference</text>
      <text x="0" y="50" class="mono tech-pill">Kalman Filters</text>
      <text x="0" y="68" class="mono tech-pill" fill="#64748B">TensorFlow · Scikit-learn</text>
    </g>
  </g>

  <!-- Card 4: Data & Spatial Modeling -->
  <g transform="translate(840, 0)">
    <rect width="260" height="150" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 100 0" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />

    <text x="16" y="24" class="mono dom-num" fill="#34D399">04 / ANALYTICS</text>
    <text x="16" y="44" class="sans dom-title">DATA &amp; RISK MODELING</text>

    <g transform="translate(16, 60)">
      <text x="0" y="14" class="mono tech-pill"><tspan class="tech-highlight" fill="#34D399">NumPy</tspan> · <tspan class="tech-highlight">Pandas</tspan></text>
      <text x="0" y="32" class="mono tech-pill">GeoJSON · Folium</text>
      <text x="0" y="50" class="mono tech-pill">Spatial Diffusion</text>
      <text x="0" y="68" class="mono tech-pill" fill="#64748B">Expected Improvement · ROC</text>
    </g>
  </g>
</svg>
