<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 310" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132347" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <filter id="glowRag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridRag" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <!-- Arrow Marker -->
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38BDF8" />
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .stage-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
    .stage-title { font-weight: 700; font-size: 14px; fill: #F8FAFC; }
    .panel-header { font-size: 11px; font-weight: 700; fill: #38BDF8; }
    .detail-primary { font-size: 11px; font-weight: 600; fill: #E2E8F0; }
    .detail-sub { font-size: 10px; fill: #94A3B8; }
    .subhead { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; fill: #64748B; }
  </style>

  <!-- Background Canvas -->
  <rect width="1180" height="310" rx="14" fill="url(#bgRag)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1180" height="310" rx="14" fill="url(#gridRag)" />

  <!-- Diagram Title Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="0" class="mono subhead">RAG ARCHITECTURE · CONTEXT-GROUNDED INFERENCE</text>
    <text x="0" y="24" class="sans" font-size="20" font-weight="700" fill="#F8FAFC">Financial Report Analyser Pipeline</text>
    <text x="680" y="24" class="mono" font-size="11" fill="#34D399">FASTAPI · FAISS · HUGGINGFACE · GROQ LLAMA 3.1</text>
  </g>

  <!-- ==================== 5 STAGE CARDS ==================== -->

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(30, 75)">
    <!-- Main Card Body -->
    <rect width="195" height="205" rx="8" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 70 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="14" y="24" class="mono stage-tag" fill="#38BDF8">01 · INGESTION</text>
    <text x="14" y="44" class="sans stage-title">PDF Documents</text>

    <!-- Details Inner Box -->
    <g transform="translate(12, 58)">
      <rect width="171" height="135" rx="6" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" class="mono panel-header">Semantic Chunking</text>
      <text x="10" y="42" class="sans detail-primary">Financial 10-K Reports</text>
      <text x="10" y="60" class="sans detail-sub">• Recursive splitter</text>
      <text x="10" y="78" class="sans detail-sub">• Preserves tables</text>
      <text x="10" y="96" class="sans detail-sub">• Footnote context</text>
      <text x="10" y="118" class="mono" font-size="9" fill="#38BDF8">Overlap: 128 tok</text>
    </g>
  </g>

  <!-- Connector Line 1 -> 2 -->
  <g transform="translate(225, 175)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowHead)" />
  </g>

  <!-- STAGE 2: VECTOR STORE -->
  <g transform="translate(265, 75)">
    <rect width="195" height="205" rx="8" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 70 0" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="14" y="24" class="mono stage-tag" fill="#818CF8">02 · VECTOR STORE</text>
    <text x="14" y="44" class="sans stage-title">FAISS Index</text>

    <g transform="translate(12, 58)">
      <rect width="171" height="135" rx="6" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" class="mono panel-header" fill="#818CF8">Dense Embeddings</text>
      <text x="10" y="42" class="sans detail-primary">HuggingFace Model</text>
      <text x="10" y="60" class="sans detail-sub">• Transformer encoder</text>
      <text x="10" y="78" class="sans detail-sub">• FAISS IndexFlatIP</text>
      <text x="10" y="96" class="sans detail-sub">• Inner-product metric</text>
      <text x="10" y="118" class="mono" font-size="9" fill="#818CF8">Dense representation</text>
    </g>
  </g>

  <!-- Connector Line 2 -> 3 -->
  <g transform="translate(460, 175)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowHead)" />
  </g>

  <!-- STAGE 3: RETRIEVAL -->
  <g transform="translate(500, 75)">
    <rect width="195" height="205" rx="8" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 70 0" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="14" y="24" class="mono stage-tag" fill="#818CF8">03 · RETRIEVAL</text>
    <text x="14" y="44" class="sans stage-title">FastAPI Backend</text>

    <g transform="translate(12, 58)">
      <rect width="171" height="135" rx="6" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" class="mono panel-header" fill="#818CF8">Context Assembly</text>
      <text x="10" y="42" class="sans detail-primary">Top-K Similarity</text>
      <text x="10" y="60" class="sans detail-sub">• Cosine similarity rank</text>
      <text x="10" y="78" class="sans detail-sub">• Dynamic thresholding</text>
      <text x="10" y="96" class="sans detail-sub">• Prompt synthesis</text>
      <text x="10" y="118" class="mono" font-size="9" fill="#38BDF8">RESTful Endpoint</text>
    </g>
  </g>

  <!-- Connector Line 3 -> 4 -->
  <g transform="translate(695, 175)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowHead)" />
  </g>

  <!-- STAGE 4: INFERENCE -->
  <g transform="translate(735, 75)">
    <rect width="195" height="205" rx="8" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2" />
    <path d="M 12 0 L 70 0" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" />

    <text x="14" y="24" class="mono stage-tag" fill="#C084FC">04 · INFERENCE</text>
    <text x="14" y="44" class="sans stage-title">Groq LLaMA 3.1</text>

    <g transform="translate(12, 58)">
      <rect width="171" height="135" rx="6" fill="#080C17" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="22" class="mono panel-header" fill="#C084FC">LLM Generation</text>
      <text x="10" y="42" class="sans detail-primary">Grounded Reasoning</text>
      <text x="10" y="60" class="sans detail-sub">• Groq LPU engine</text>
      <text x="10" y="78" class="sans detail-sub">• Context-bound prompts</text>
      <text x="10" y="96" class="sans detail-sub">• Document citations</text>
      <text x="10" y="118" class="mono" font-size="9" fill="#34D399">Zero hallucinations</text>
    </g>
  </g>

  <!-- Connector Line 4 -> 5 -->
  <g transform="translate(930, 175)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#34D399" stroke-width="2" marker-end="url(#arrowHead)" />
  </g>

  <!-- STAGE 5: OUTPUT -->
  <g transform="translate(970, 75)">
    <rect width="180" height="205" rx="8" fill="url(#activeGrad)" stroke="#34D399" stroke-width="1.4" filter="url(#glowRag)" />
    <rect width="180" height="205" rx="8" fill="url(#activeGrad)" stroke="#34D399" stroke-width="1.4" />
    <path d="M 12 0 L 70 0" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />

    <text x="14" y="24" class="mono stage-tag" fill="#34D399">05 · OUTPUT</text>
    <text x="14" y="44" class="sans stage-title">Streamlit UI</text>

    <g transform="translate(12, 58)">
      <rect width="156" height="135" rx="6" fill="#080C17" stroke="#1E293B" stroke-width="0.8" />
      <text x="10" y="22" class="mono panel-header" fill="#34D399">Interactive QA</text>
      <text x="10" y="42" class="sans detail-primary">Audit-Grade QA</text>
      <text x="10" y="62" class="mono" font-size="10" fill="#34D399">✓ Cited Answers</text>
      <text x="10" y="80" class="mono" font-size="10" fill="#34D399">✓ Source Chunks</text>
      <text x="10" y="98" class="mono" font-size="10" fill="#34D399">✓ Query Stream</text>
      <text x="10" y="118" class="mono" font-size="9" fill="#94A3B8">Web Interface</text>
    </g>
  </g>
</svg>
